<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            overflow:hidden;
            position:relative;

            background:
            radial-gradient(circle at top left,#00d9ff33,transparent 30%),
            radial-gradient(circle at bottom right,#8b5cf633,transparent 30%),
            linear-gradient(135deg,#020617,#0f172a,#111827);

            display:flex;
            justify-content:center;
            align-items:center;
        }

        /* Animated Grid */

        body::before{
            content:'';
            position:absolute;
            inset:0;

            background-image:
            linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

            background-size:50px 50px;

            animation:gridMove 20s linear infinite;

            pointer-events:none;
        }

        @keyframes gridMove{
            0%{
                transform:translateY(0);
            }

            100%{
                transform:translateY(50px);
            }
        }

        /* Glow Effects */

        .glow{
            position:absolute;
            border-radius:50%;
            filter:blur(120px);
            opacity:0.5;

            pointer-events:none;
        }

        .glow1{
            width:350px;
            height:350px;
            background:#00d9ff;
            top:-120px;
            left:-120px;
            animation:float1 8s ease-in-out infinite;
        }

        .glow2{
            width:350px;
            height:350px;
            background:#8b5cf6;
            bottom:-120px;
            right:-120px;
            animation:float2 10s ease-in-out infinite;
        }

        @keyframes float1{
            0%,100%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(40px);
            }
        }

        @keyframes float2{
            0%,100%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(-40px);
            }
        }

        /* Main Card */

        .login-card{

            position:relative;
            z-index:10;

            width:430px;

            background:rgba(8,15,30,0.75);

            border:1px solid rgba(255,255,255,0.12);

            backdrop-filter:blur(20px);

            border-radius:30px;

            padding:45px 35px;

            box-shadow:
            0 0 30px rgba(0,217,255,0.12),
            0 0 60px rgba(139,92,246,0.12);

            overflow:hidden;

            animation:fadeIn 1s ease;
        }

        .login-card::before{
            content:'';
            position:absolute;
            inset:0;
            border-radius:30px;
            padding:1px;

            background:linear-gradient(135deg,#00d9ff,#8b5cf6);

            -webkit-mask:
            linear-gradient(#fff 0 0) content-box,
            linear-gradient(#fff 0 0);

            -webkit-mask-composite:xor;
            mask-composite:exclude;

            pointer-events:none;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(40px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            text-align:center;
            font-size:16px;
            color:#00d9ff;
            margin-bottom:15px;
            letter-spacing:3px;
            font-weight:600;
        }

        h2{
            text-align:center;
            color:white;
            font-size:42px;
            margin-bottom:10px;
            font-weight:700;
        }

        .subtitle{
            text-align:center;
            color:#94a3b8;
            margin-bottom:35px;
            font-size:14px;
        }

        .input-box{
            margin-bottom:22px;
        }

        .input-box label{
            display:block;
            color:#cbd5e1;
            margin-bottom:8px;
            font-size:14px;
        }

        .input-box input{
            width:100%;
            padding:16px 18px;

            background:rgba(255,255,255,0.04);

            border:1px solid rgba(255,255,255,0.1);

            border-radius:14px;

            color:white;
            font-size:15px;

            outline:none;

            transition:0.4s ease;

            position:relative;
            z-index:20;
        }

        .input-box input:focus{
            border-color:#00d9ff;

            box-shadow:
            0 0 15px rgba(0,217,255,0.25);
        }

        .input-box input::placeholder{
            color:#64748b;
        }

        .login-btn{

            width:100%;
            padding:16px;

            border:none;

            border-radius:50px;

            background:linear-gradient(135deg,#00d9ff,#0ea5e9);

            color:black;

            font-size:17px;
            font-weight:700;

            cursor:pointer;

            transition:0.4s ease;

            margin-top:10px;

            position:relative;
            z-index:20;
        }

        .login-btn:hover{

            transform:translateY(-5px) scale(1.02);

            box-shadow:
            0 10px 25px rgba(0,217,255,0.35);
        }

        .home-btn{

            width:100%;
            padding:15px;

            margin-top:15px;

            border-radius:50px;

            border:1px solid rgba(255,255,255,0.2);

            background:transparent;

            color:white;

            cursor:pointer;

            transition:0.4s ease;

            position:relative;
            z-index:20;
        }

        .home-btn:hover{
            background:white;
            color:black;
        }

        .bottom-text{
            text-align:center;
            margin-top:25px;
            color:#94a3b8;
            font-size:14px;

            position:relative;
            z-index:20;
        }

        .bottom-text a{
            color:#00d9ff;
            text-decoration:none;
            font-weight:600;
        }

        /* Floating Particles */

        .particles span{
            position:absolute;
            width:4px;
            height:4px;
            background:white;
            border-radius:50%;
            opacity:0.3;
            animation:particleMove 15s linear infinite;

            pointer-events:none;
        }

        .particles span:nth-child(1){
            left:10%;
            top:80%;
        }

        .particles span:nth-child(2){
            left:80%;
            top:70%;
        }

        .particles span:nth-child(3){
            left:50%;
            top:90%;
        }

        .particles span:nth-child(4){
            left:30%;
            top:60%;
        }

        @keyframes particleMove{
            0%{
                transform:translateY(0);
                opacity:0;
            }

            50%{
                opacity:1;
            }

            100%{
                transform:translateY(-180px);
                opacity:0;
            }
        }

        @media(max-width:500px){

            .login-card{
                width:92%;
                padding:35px 25px;
            }

            h2{
                font-size:32px;
            }

        }

    </style>

</head>

<body>

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="login-card">

        <div class="logo">
            AI SECURITY SYSTEM
        </div>

        <h2>Verify The Truth</h2>

        <div class="subtitle">
            Access your intelligent fake news detection dashboard
        </div>

        <form method="POST" action="/login">

            <div class="input-box">
                <label>Email Address</label>

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="input-box">
                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <button type="submit" class="login-btn">
                LOGIN
            </button>

            <button type="button"
                    class="home-btn"
                    onclick="window.location.href='{{ url_for('index') }}'">

                BACK TO HOME

            </button>

        </form>

        <div class="bottom-text">

            Don’t have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </div>

    </div>

</body>
</html>
