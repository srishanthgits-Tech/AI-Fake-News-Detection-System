<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI OTP Verification</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            overflow:hidden;
            position:relative;

            background:
            radial-gradient(circle at top left,#00d9ff22,transparent 30%),
            radial-gradient(circle at bottom right,#8b5cf622,transparent 30%),
            linear-gradient(135deg,#020617,#0f172a,#111827);

            display:flex;
            justify-content:center;
            align-items:center;
        }

        body::before{
            content:'';
            position:absolute;
            inset:0;

            background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

            background-size:45px 45px;

            animation:gridMove 20s linear infinite;

            pointer-events:none;
        }

        @keyframes gridMove{
            0%{
                transform:translateY(0);
            }

            100%{
                transform:translateY(45px);
            }
        }

        /* Glow Effects */

        .glow{
            position:absolute;
            border-radius:50%;
            filter:blur(120px);
            opacity:0.5;
            pointer-events:none;
        }

        .glow1{
            width:350px;
            height:350px;
            background:#00d9ff;
            top:-120px;
            left:-120px;
            animation:float1 8s ease-in-out infinite;
        }

        .glow2{
            width:350px;
            height:350px;
            background:#8b5cf6;
            bottom:-120px;
            right:-120px;
            animation:float2 10s ease-in-out infinite;
        }

        @keyframes float1{
            0%,100%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(40px);
            }
        }

        @keyframes float2{
            0%,100%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(-40px);
            }
        }

        /* Verification Card */

        .otp-container{

            position:relative;
            z-index:10;

            width:430px;

            background:rgba(8,15,30,0.78);

            border:1px solid rgba(255,255,255,0.12);

            backdrop-filter:blur(20px);

            border-radius:32px;

            padding:50px 35px;

            text-align:center;

            overflow:hidden;

            box-shadow:
            0 0 35px rgba(0,217,255,0.15),
            0 0 70px rgba(139,92,246,0.15);

            animation:fadeIn 1s ease;
        }

        .otp-container::before{
            content:'';
            position:absolute;
            inset:0;

            border-radius:32px;
            padding:1px;

            background:linear-gradient(135deg,#00d9ff,#8b5cf6);

            -webkit-mask:
            linear-gradient(#fff 0 0) content-box,
            linear-gradient(#fff 0 0);

            -webkit-mask-composite:xor;
            mask-composite:exclude;

            pointer-events:none;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(40px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* Scanner Animation */

        .scanner{
            width:120px;
            height:120px;

            margin:auto;
            margin-bottom:30px;

            position:relative;
        }

        .ring{
            position:absolute;
            inset:0;

            border-radius:50%;

            border:2px solid rgba(0,217,255,0.3);

            animation:rotate 6s linear infinite;
        }

        .ring:nth-child(2){
            inset:12px;
            animation-direction:reverse;
            border-color:rgba(139,92,246,0.4);
        }

        .ring:nth-child(3){
            inset:24px;
            border-color:rgba(255,255,255,0.2);
        }

        @keyframes rotate{
            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }
        }

        .shield{
            position:absolute;
            inset:0;

            display:flex;
            justify-content:center;
            align-items:center;

            color:#00d9ff;

            font-size:42px;
            font-weight:700;

            animation:pulse 2s infinite;
        }

        @keyframes pulse{
            0%,100%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.08);
            }
        }

        .logo{
            color:#00d9ff;
            letter-spacing:3px;
            font-size:14px;
            font-weight:600;
            margin-bottom:15px;
        }

        h2{
            color:white;
            font-size:40px;
            margin-bottom:12px;
        }

        .subtitle{
            color:#94a3b8;
            font-size:15px;
            line-height:1.7;
            margin-bottom:35px;
        }

        /* OTP Input */

        .otp-input{
            width:100%;

            padding:18px;

            border-radius:18px;

            border:1px solid rgba(255,255,255,0.1);

            background:rgba(255,255,255,0.04);

            color:white;

            text-align:center;

            font-size:24px;

            letter-spacing:10px;

            outline:none;

            transition:0.4s ease;
        }

        .otp-input:focus{

            border-color:#00d9ff;

            box-shadow:
            0 0 20px rgba(0,217,255,0.25);
        }

        .otp-input::placeholder{
            color:#64748b;
            letter-spacing:4px;
        }

        /* Button */

        .verify-btn{

            width:100%;

            padding:16px;

            margin-top:25px;

            border:none;

            border-radius:50px;

            background:
            linear-gradient(135deg,#00d9ff,#0ea5e9);

            color:black;

            font-size:17px;
            font-weight:700;

            cursor:pointer;

            transition:0.4s ease;
        }

        .verify-btn:hover{

            transform:translateY(-4px);

            box-shadow:
            0 10px 25px rgba(0,217,255,0.35);
        }

        /* Alerts */

        .alert{
            margin-top:18px;

            padding:14px;

            border-radius:14px;

            font-size:14px;
        }

        .alert-success{
            background:rgba(34,197,94,0.15);
            color:#4ade80;
            border:1px solid rgba(34,197,94,0.3);
        }

        .alert-danger{
            background:rgba(239,68,68,0.15);
            color:#f87171;
            border:1px solid rgba(239,68,68,0.3);
        }

        /* Floating Particles */

        .particles span{
            position:absolute;
            width:4px;
            height:4px;
            background:white;
            border-radius:50%;
            opacity:0.3;

            animation:particleMove 15s linear infinite;

            pointer-events:none;
        }

        .particles span:nth-child(1){
            top:10%;
            left:20%;
        }

        .particles span:nth-child(2){
            top:75%;
            left:85%;
        }

        .particles span:nth-child(3){
            top:50%;
            left:45%;
        }

        .particles span:nth-child(4){
            top:88%;
            left:15%;
        }

        @keyframes particleMove{
            0%{
                transform:translateY(0);
                opacity:0;
            }

            50%{
                opacity:1;
            }

            100%{
                transform:translateY(-180px);
                opacity:0;
            }
        }

        @media(max-width:500px){

            .otp-container{
                width:92%;
                padding:40px 25px;
            }

            h2{
                font-size:32px;
            }

        }

    </style>

</head>

<body>

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="otp-container">

        <div class="scanner">

            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>

            <div class="shield">
                ✓
            </div>

        </div>

        <div class="logo">
            AI SECURITY VERIFICATION
        </div>

        <h2>Verify Identity</h2>

        <div class="subtitle">
            Enter the secure verification code sent to your email
            to access the intelligent detection system.
        </div>

        <form method="POST" action="{{ url_for('verify_otp') }}">

            <input type="text"
                   name="otp"
                   class="otp-input"
                   placeholder="••••••"
                   required>

            <button type="submit" class="verify-btn">
                VERIFY OTP
            </button>

        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                <div class="alert alert-{{ messages[-1][0] }}">

                    {{ messages[-1][1] }}

                </div>

            {% endif %}

        {% endwith %}

    </div>

</body>
</html>
